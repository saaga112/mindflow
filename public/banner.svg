<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f"/>
      <stop offset="50%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="glowCyan" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:rgba(6,182,212,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(6,182,212,0)"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="glowPurple" cx="70%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(139,92,246,0)"/>
    </radialGradient>

    <!-- Node gradients -->
    <linearGradient id="nodeQuestion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#22224a"/>
    </linearGradient>
    <linearGradient id="nodeAnswer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#111a35"/>
    </linearGradient>

    <!-- Animated edge gradient -->
    <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edgeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <!-- Logo icon gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="0.5"/>
    </pattern>

    <!-- Dot pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="rgba(148,163,184,0.08)"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="400" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" fill="url(#glowPurple)"/>

  <!-- ═══ Graph visualization (right side) ═══ -->

  <!-- Edges (connections between nodes) -->
  <g opacity="0.6" filter="url(#glow)">
    <!-- Root to children -->
    <path d="M 820 140 C 820 170, 730 170, 730 200" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 820 140 C 820 170, 920 170, 920 200" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Left child to grandchild -->
    <path d="M 730 240 C 730 270, 680 270, 680 295" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 730 240 C 730 270, 790 270, 790 295" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Right child to grandchild -->
    <path d="M 920 240 C 920 265, 960 265, 960 290" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Root node (Question) -->
  <g transform="translate(770, 105)">
    <rect x="0" y="0" width="100" height="35" rx="8" fill="url(#nodeQuestion)" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <circle cx="10" cy="17" r="4" fill="#06b6d4" opacity="0.8"/>
    <rect x="20" y="12" width="55" height="4" rx="2" fill="rgba(241,245,249,0.3)"/>
    <rect x="20" y="20" width="35" height="3" rx="1.5" fill="rgba(148,163,184,0.2)"/>
  </g>

  <!-- Left answer node -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="url(#nodeAnswer)" stroke="#8b5cf6" stroke-width="1" opacity="0.85"/>
    <circle cx="10" cy="14" r="4" fill="#8b5cf6" opacity="0.8"/>
    <rect x="20" y="10" width="60" height="3" rx="1.5" fill="rgba(241,245,249,0.25)"/>
    <rect x="20" y="17" width="45" height="3" rx="1.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="24" width="55" height="3" rx="1.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="31" width="30" height="3" rx="1.5" fill="rgba(148,163,184,0.1)"/>
  </g>

  <!-- Right answer node -->
  <g transform="translate(870, 200)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="url(#nodeAnswer)" stroke="#8b5cf6" stroke-width="1" opacity="0.85"/>
    <circle cx="10" cy="14" r="4" fill="#8b5cf6" opacity="0.8"/>
    <rect x="20" y="10" width="50" height="3" rx="1.5" fill="rgba(241,245,249,0.25)"/>
    <rect x="20" y="17" width="65" height="3" rx="1.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="24" width="40" height="3" rx="1.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="31" width="55" height="3" rx="1.5" fill="rgba(148,163,184,0.1)"/>
  </g>

  <!-- Bottom-left question node -->
  <g transform="translate(640, 295)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#nodeQuestion)" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>
    <circle cx="9" cy="15" r="3.5" fill="#06b6d4" opacity="0.7"/>
    <rect x="18" y="11" width="45" height="3" rx="1.5" fill="rgba(241,245,249,0.2)"/>
    <rect x="18" y="18" width="30" height="3" rx="1.5" fill="rgba(148,163,184,0.12)"/>
  </g>

  <!-- Bottom-center question node (branched) -->
  <g transform="translate(750, 295)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#nodeQuestion)" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
    <circle cx="9" cy="15" r="3.5" fill="#22d3ee" opacity="0.7"/>
    <rect x="18" y="11" width="40" height="3" rx="1.5" fill="rgba(241,245,249,0.2)"/>
    <rect x="18" y="18" width="50" height="3" rx="1.5" fill="rgba(148,163,184,0.12)"/>
  </g>

  <!-- Bottom-right answer node -->
  <g transform="translate(920, 290)">
    <rect x="0" y="0" width="85" height="35" rx="6" fill="url(#nodeAnswer)" stroke="#a78bfa" stroke-width="1" opacity="0.65"/>
    <circle cx="9" cy="12" r="3.5" fill="#a78bfa" opacity="0.7"/>
    <rect x="18" y="8" width="50" height="3" rx="1.5" fill="rgba(241,245,249,0.2)"/>
    <rect x="18" y="15" width="55" height="3" rx="1.5" fill="rgba(148,163,184,0.12)"/>
    <rect x="18" y="22" width="35" height="3" rx="1.5" fill="rgba(148,163,184,0.12)"/>
  </g>

  <!-- Sticky note -->
  <g transform="translate(1040, 140)">
    <rect x="0" y="0" width="70" height="55" rx="6" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <rect x="10" y="12" width="50" height="3" rx="1.5" fill="rgba(245,158,11,0.25)"/>
    <rect x="10" y="19" width="40" height="3" rx="1.5" fill="rgba(245,158,11,0.15)"/>
    <rect x="10" y="26" width="45" height="3" rx="1.5" fill="rgba(245,158,11,0.15)"/>
    <rect x="10" y="33" width="30" height="3" rx="1.5" fill="rgba(245,158,11,0.1)"/>
  </g>

  <!-- Floating particles -->
  <circle cx="620" cy="130" r="1.5" fill="#06b6d4" opacity="0.4"/>
  <circle cx="1100" cy="300" r="1" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="650" cy="350" r="1.2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="1050" cy="100" r="1" fill="#22d3ee" opacity="0.35"/>
  <circle cx="1130" cy="250" r="0.8" fill="#06b6d4" opacity="0.25"/>

  <!-- ═══ Logo + Text (left side) ═══ -->

  <!-- Brain/graph icon -->
  <g transform="translate(80, 130)" filter="url(#glowStrong)">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.3"/>
    <!-- Inner neural paths -->
    <circle cx="50" cy="35" r="5" fill="#22d3ee" opacity="0.9"/>
    <circle cx="32" cy="55" r="5" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="68" cy="55" r="5" fill="#a78bfa" opacity="0.9"/>
    <circle cx="42" cy="72" r="4" fill="#06b6d4" opacity="0.7"/>
    <circle cx="58" cy="72" r="4" fill="#8b5cf6" opacity="0.7"/>
    <!-- Connections -->
    <line x1="50" y1="40" x2="35" y2="52" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="40" x2="65" y2="52" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
    <line x1="35" y1="58" x2="44" y2="69" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="58" x2="56" y2="69" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
    <line x1="35" y1="55" x2="65" y2="55" stroke="url(#edgeGrad1)" stroke-width="1" opacity="0.3"/>
    <line x1="44" y1="72" x2="56" y2="72" stroke="url(#edgeGrad1)" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="210" y="172" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="52" fill="#f1f5f9" letter-spacing="-1">
    Mind<tspan fill="url(#logoGrad)">Flow</tspan>
  </text>

  <!-- Tagline -->
  <text x="213" y="205" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#94a3b8" letter-spacing="0.5">
    Infinite Canvas AI Learning Platform
  </text>

  <!-- Feature pills -->
  <g transform="translate(210, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="105" height="26" rx="13" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
    <circle cx="14" cy="13" r="3" fill="#06b6d4" opacity="0.8"/>
    <text x="22" y="17" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#22d3ee">Visual Graph</text>

    <!-- Pill 2 -->
    <rect x="115" y="0" width="120" height="26" rx="13" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
    <circle cx="129" cy="13" r="3" fill="#8b5cf6" opacity="0.8"/>
    <text x="137" y="17" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#a78bfa">Branch &amp; Explore</text>

    <!-- Pill 3 -->
    <rect x="245" y="0" width="105" height="26" rx="13" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
    <circle cx="259" cy="13" r="3" fill="#f59e0b" opacity="0.8"/>
    <text x="267" y="17" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#fbbf24">Multi-Model</text>
  </g>

  <!-- Divider line -->
  <line x1="600" y1="100" x2="600" y2="340" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#edgeGrad1)" opacity="0.6"/>
  <!-- Bottom border accent -->
  <rect x="0" y="398" width="1200" height="2" fill="url(#edgeGrad1)" opacity="0.3"/>
</svg>
